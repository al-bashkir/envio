[package]
name = "envio"
version = "0.7.0"
rust-version = "1.75.0"
description = "A Modern And Secure CLI Tool For Managing Environment Variables"
edition = "2021"
authors = ["Al Bashkir <41126916+al-bashkir@users.noreply.github.com>"]
repository = "https://github.com/al-bashkir/envio/"
license = "MIT/Apache-2.0"
readme = "README.md"


[lib]
name = "envio"
path = "src/lib.rs"
doctest = false

[dependencies]
age = "0.9.1"
base64 = "0.21"
bincode = "1.3.3"
chrono = { version = "0.4.33", features = ["serde"] }
clap = { version = "4.3.24", features = ["derive"] }
clap_complete = "4.5.1"
colored = "2.0.0"
comfy-table = "6.1.4"
dirs = "5.0.0"
hmac = "0.12"
inquire = { version = "0.7.0", features = ["date"] }
percent-encoding = "2.2"
semver = "1.0.17"
serde = { version = "1.0.159", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.5"
typetag = "0.2"
regex = "1.7"
tokio = "1.28.0"
thiserror = "1.0.58"

[target.'cfg(unix)'.dependencies]
gpgme = "0.11"

[dependencies.reqwest]
version = "0.11.16"
default-features = false
features = ["rustls-tls-native-roots", "blocking", "json"]

[build-dependencies]
chrono = "0.4.33"
clap = { version = "4.1.8", features = ["derive"] }
clap_mangen = "0.2.9"
clap_complete = "4.5.1"

[profile.release]
lto = true
